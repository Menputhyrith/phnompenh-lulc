<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        #map {
            width: 1556px;
            height: 894px;
        }
        </style>
        <title></title>
    </head>
    <body>

        <div id="lulc-class-panel">
            <div class="lulc-header">LULC 2026</div>
            <div class="lulc-subtitle">Show or hide individual land-cover classes</div>
            <label class="all-row"><input type="checkbox" id="lulc-all" checked><span>All classes</span></label>
            <label><input type="checkbox" class="lulc-class-check" data-layer="lyr_LULC_Urban"><span class="swatch" style="background:#DE3A13"></span><span>Urban / Built-up</span></label>
            <label><input type="checkbox" class="lulc-class-check" data-layer="lyr_LULC_Agriculture"><span class="swatch" style="background:#E1D904"></span><span>Agriculture</span></label>
            <label><input type="checkbox" class="lulc-class-check" data-layer="lyr_LULC_Water"><span class="swatch" style="background:#1761D1"></span><span>Water</span></label>
            <label><input type="checkbox" class="lulc-class-check" data-layer="lyr_LULC_Vegetation"><span class="swatch" style="background:#297B18"></span><span>Vegetation / Forest</span></label>
            <label><input type="checkbox" class="lulc-class-check" data-layer="lyr_LULC_Shrubland"><span class="swatch" style="background:#EA9B0A"></span><span>Shrubland</span></label>
            <div class="hint">Select one class to see only that class. You can also select multiple classes.</div>
        </div>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/Commune_PP_1.js"></script><script src="layers/Point_District_2.js"></script><script src="layers/Point_Province_3.js"></script><script src="layers/PP_Commune_4.js"></script><script src="layers/District_PP_5.js"></script><script src="layers/PhnomPenh_6.js"></script>
        <script src="styles/Commune_PP_1_style.js"></script><script src="styles/Point_District_2_style.js"></script><script src="styles/Point_Province_3_style.js"></script><script src="styles/PP_Commune_4_style.js"></script><script src="styles/District_PP_5_style.js"></script><script src="styles/PhnomPenh_6_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 

        <script>
        // LULC class controls: the complete layer is shown when "All classes" is checked.
        (function() {
            function getLayerByName(name) { return window[name]; }
            var allBox = document.getElementById('lulc-all');
            var boxes = Array.prototype.slice.call(document.querySelectorAll('.lulc-class-check'));
            function setAllMode() {
                lyr_PhnomPenh_LULC_2026_RF_0.setVisible(true);
                lulcClassLayers.forEach(function(layer) { layer.setVisible(false); });
                boxes.forEach(function(b) { b.checked = false; });
                allBox.checked = true;
            }
            function updateClasses() {
                var selected = boxes.filter(function(b) { return b.checked; });
                if (selected.length === 0) { setAllMode(); return; }
                lyr_PhnomPenh_LULC_2026_RF_0.setVisible(false);
                lulcClassLayers.forEach(function(layer) { layer.setVisible(false); });
                selected.forEach(function(b) {
                    var layer = getLayerByName(b.getAttribute('data-layer'));
                    if (layer) layer.setVisible(true);
                });
                allBox.checked = false;
            }
            allBox.addEventListener('change', function() { if (this.checked) setAllMode(); else updateClasses(); });
            boxes.forEach(function(b) { b.addEventListener('change', updateClasses); });
        })();
        </script>
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
    </body>
</html>
